<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Clans Sentinel</title>
    <script>
      // Apply saved theme/mode before React renders to avoid flash
      try{
        var t = localStorage.getItem("app_theme");
        if (t && t !== "forest") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("app_light") === "1") document.documentElement.setAttribute("data-light", "");
      }catch{}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
